<!doctype html>
<html lang="es">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Responder mensaje | TechBox Admin</title>
		<link rel="stylesheet" href="../css/estilos.css" />
		<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" crossorigin="anonymous" />
	</head>
	<body class="admin adminMensajes">
		<aside class="admin__sidebar">
			<a href="dashboard.html" class="admin__sidebar__logo"><img src="../img/techbox-logo-white.png" alt="TechBox Admin" /></a>
			<nav class="admin__sidebar__menu">
				<a href="dashboard.html" class="admin__sidebar__menu--link"><i class="fa-solid fa-chart-line"></i>Dashboard</a><a href="productos.html" class="admin__sidebar__menu--link"><i class="fa-solid fa-box"></i>Productos</a
				><a href="categorias.html" class="admin__sidebar__menu--link"><i class="fa-solid fa-layer-group"></i>Categorías</a><a href="mensajes.html" class="admin__sidebar__menu--link active"><i class="fa-solid fa-envelope"></i>Mensajes</a
				><a href="#" class="admin__sidebar__menu--link"><i class="fa-solid fa-cart-shopping"></i>Pedidos</a>
			</nav>
			<div class="admin__sidebar__inferior">
				<a href="../index.html" class="admin__sidebar__inferior--link"><i class="fa-solid fa-arrow-right-from-bracket"></i>Salir</a>
			</div>
		</aside>
		<div class="admin__principal">
			<header class="admin__principal__topbar">
				<button type="button" class="admin__principal__topbar--menu" aria-label="Abrir menú"><i class="fa-solid fa-bars"></i></button>
				<div></div>
				<strong>Juan Pérez</strong>
			</header>
			<main class="adminMensajes__contenido">
				<section class="adminMensajes__contenido__respuesta">
					<a href="mensaje-detalle.html" class="adminMensajes__contenido__respuesta--volver"><i class="fa-solid fa-arrow-left"></i> Volver al mensaje</a>
					<h1 class="adminMensajes__contenido__respuesta--titulo">Responder mensaje</h1>
					<form class="adminMensajes__contenido__respuesta__form" data-respuesta-form>
						<div class="adminMensajes__contenido__respuesta__form__grupo"><label for="respuesta-destinatario">Destinatario</label><input id="respuesta-destinatario" type="email" value="maria.gonzalez@email.com" readonly /></div>
						<div class="adminMensajes__contenido__respuesta__form__grupo"><label for="respuesta-asunto">Asunto</label><input id="respuesta-asunto" value="Re: Consulta sobre disponibilidad de laptop" required /></div>
						<div class="adminMensajes__contenido__respuesta__form__grupo">
							<label for="respuesta-cuerpo">Mensaje</label
							><textarea id="respuesta-cuerpo" required placeholder="Escribe tu respuesta...">
Hola María, gracias por escribirnos. Hemos recibido tu consulta y estamos revisando la disponibilidad del producto solicitado. Quedamos atentos para ayudarte.</textarea
							>
						</div>
						<div class="adminMensajes__contenido__respuesta__form__grupo">
							<label for="respuesta-adjunto">Archivo adjunto <span>(opcional)</span></label
							><input id="respuesta-adjunto" type="file" />
						</div>
						<div class="adminMensajes__contenido__respuesta__form__acciones">
							<a href="mensaje-detalle.html" class="btn adminMensajes__contenido__respuesta__form__acciones--cancelar">Cancelar</a><button type="submit" class="btn btn--primary"><i class="fa-solid fa-paper-plane"></i> Enviar respuesta</button>
						</div>
						<p class="adminMensajes__contenido__respuesta__form--estado" role="status" aria-live="polite"></p>
					</form>
				</section>
			</main>
		</div>
		<script src="../js/admin.js"></script>
		<script src="../js/admin-responder.js"></script>
	</body>
</html>
