<!DOCTYPE html>
<!-- ATRIBUTOS O CON VALOR -->
<!-- SEO -> SEARCH ENGINE OPTIMIZATION -->
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <!-- RESPONSIVE DESIGN -->
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Curso HTML</title>
        <!-- CSS -> CASCADE STYLE SHEET -->
        <style>
            body {
                margin: 0;
            }
            header {
                border: 3px solid peru; /* nombre, rgb, hex */
                color: peru;
                text-align: center;
            }
            section {
                border: 3px solid #1abc9c;
            }
            section article {
                width: 200px;
            }
            section aside {
                width: 139px;
            }
        </style>
    </head>
    <body>
        <!-- las etiquetas nuevas de html5 son solo divs con otro nombre para entender la estructura de tu aplicación -->
        <header>
            SOY UN ENCABEZADO
        </header>
        <section>
            <article>soy un articulo</article>
            <aside>soy un elemento que esta en la parte izquierda</aside>
        </section>
        <footer>
            Soy un pie de página
        </footer>
    </body>
</html>
