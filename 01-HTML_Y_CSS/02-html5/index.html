<!DOCTYPE html>
<!-- ATRIBUTOS O CON VALOR -->
<!-- SEO -> SEARCH ENGINE OPTIMIZATION -->
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <!-- RESPONSIVE DESIGN -->
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Curso HTML</title>
        <!-- CSS -> CASCADE STYLE SHEET -->
        <style>
            body {
                margin: 0;
            }
            header {
                border: 3px solid peru; /* nombre, rgb, hex */
                color: peru;
                text-align: center;
            }
            section {
                border: 3px solid #1abc9c;
                display: flex;
                flex-wrap: wrap;
            }
            section article {
                /* width: 191px; 
                    width: 30px + 6px => 36px*/
                /*width: 150px;*/
                /*width: calc(70% - 6px);*/
                width: 70%; /* 314px  */
                border: 3px solid #2980b9; /* sumado mas ancho y bordes = 206px */
                /*display: inline-block;*/
                box-sizing: border-box;
                height: 150px;
            }
            section aside {
                /*width: 130px;*/
                /*width: calc(30% - 6px);*/
                width: 30%;
                border: 3px solid #9b59b6; /* sumado mas ancho y bordes = 145px */
                /*display: inline-block;*/
                box-sizing: border-box;
                height: 150px;
            }
            footer {
                border: 3px solid #c0392b;
                text-align: center;
            }
        </style>
    </head>
    <!-- mi body por ahora mide 339px de ancho -->
    <body>
        <!-- las etiquetas nuevas de html5 son solo divs con otro nombre para entender la estructura de tu aplicación -->
        <header>
            SOY UN ENCABEZADO
        </header>
        <section>
            <article>soy un articulo</article>
            <aside>soy un aside</aside>
        </section>
        <footer>
            Soy un pie de página
        </footer>
    </body>
</html>
