<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechBox</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
    <nav class="nav">
        <div class="nav__contenedor contenedor d-flex justify-content-between pt-1 pb-1 pl-2 pr-2">
            <a href="./" class="nav__contenedor__logoBox">
                <img src="img/techbox-logo-horizontal.png" alt="TechBox" class="nav__contenedor__logoBox--logo">
            </a>
            <div class="nav__contenedor__menu d-flex">
                <a href="#" class="nav__contenedor__menu--link active">inicio</a>
                <a href="#" class="nav__contenedor__menu--link">productos</a>
                <a href="#" class="nav__contenedor__menu--link">categorias</a>
                <a href="#" class="nav__contenedor__menu--link">ofertas</a>
                <a href="#" class="nav__contenedor__menu--link">contacto</a>
            </div>
            <form class="nav__contenedor__form">
                <div class="nav__contenedor__form__box">
                    <input type="text" placeholder="Buscar Productos...">
                    <i class="fa-solid fa-magnifying-glass"></i>
                </div>
            </form>
            <div class="nav__contenedor__actions">
                <a href="#" class="nav__contenedor__actions--link">
                    <i class="fa-regular fa-heart"></i>
                </a>
                <a href="#" class="nav__contenedor__actions--link">
                    <i class="fa-regular fa-user"></i>
                </a>
                <a href="#" class="nav__contenedor__actions--link">
                    <span class="nav__contenedor__actions--link--num">1</span>
                    <i class="fa-solid fa-cart-shopping"></i>
                </a>
            </div>
        </div>
    </nav>
    <header class="header">
        <div class="header__contenedor contenedor">
            <div class="header__contenedor__imgFondo"></div>
            <div class="header__contenedor__box">
                <div class="header__contenedor__box__info">
                    <p class="header__contenedor__box__info--top">
                        nueva generación
                    </p>
                    <h2 class="header__contenedor__box__info--titulo">
                        Técnologpia que impulsa tus ideas
                    </h2>
                    <p class="header__contenedor__box__info--descri">
                        Encuentra equipos y componentes seleccionados para trabajar, crear y disfrutar sin limites
                    </p>
                    <div class="header__contenedor__box__info__btnBox">
                        <a href="#">Ver productos</a>
                        <a href="#">Explorar categorias <i class="fa-solid fa-angle-right"></i></a>
                    </div>
                </div>
                <div class="header__contenedor__box__imgBox">
                    <img src="img/home-hero-laptop.png" alt="Laptop">
                </div>
            </div>
        </div>
    </header>
</body>
</html>
