<!-- 
    HTML - Hypertext Markup Language
    Es el lenguaje de marcado estándar para crear páginas web.

    1. texto plano
    2. Los navegadores entienden y renderizan etiquetas y contenido
    "div" "p" "h1" "h2" "h3" "h4" "h5" "h6" "a" "img" "ul" "ol" "li"

    Estructuras de etiquetas:
    1. etiqueta de apertura y cierre para agregar contendido
    2. etiqueta con contenido de fuente
-->
<div>
    contenido de texto
</div>

<p>
    parrafo
</p>

<h1>
    <div>
        contenido
    </div>
</h1>
